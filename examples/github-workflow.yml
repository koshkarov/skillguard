# .github/workflows/skillguard.yml: scan every skill on pull requests and show findings in code scanning.
name: SkillGuard

on:
  pull_request:
    paths: ["skills/**", "plugins/**", ".claude/skills/**"]

permissions:
  contents: read
  security-events: write   # upload SARIF

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: skillguard
        uses: koshkarov/skillguard@main   # pin to a release tag or commit SHA in production
        with:
          paths: skills plugins .claude/skills
          api-key: ${{ secrets.SKILLGUARD_API_KEY }}
          policy: skillguard-policy.toml
          fail-on: block                   # 'review' for a stricter gate
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skillguard.sarif
          category: skillguard
